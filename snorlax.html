<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snorlax & Munchlax - Pokemon Collection Tracker</title>
<style>
:root {
  --bg: #0d0d0d;
  --accent: #ffcb05;
  --green: #3ecf8e;
  --blue: #3d7dca;
  --text-dim: #777;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: #e8e8e8;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.5;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  touch-action: pan-y;
}
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url('images/snorlax-bg.jpg') 30% center / cover no-repeat;
  opacity: 0.3;
  z-index: 0;
  pointer-events: none;
}
header {
  position: relative;
  z-index: 1;
  background: rgba(13, 13, 13, 0.85);
  border-bottom: none;
  padding: 0.8rem 1rem;
  text-align: center;
}
header::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 4px;
  background: linear-gradient(90deg,
    #ff6ec7 0%, #a855f7 12%, #6366f1 22%, #3b82f6 32%,
    #22d3ee 42%, #34d399 52%, #facc15 62%, #fb923c 72%,
    #f43f5e 82%, #c084fc 92%, #ff6ec7 100%);
  background-size: 200% 100%;
  animation: holo-shift 3s linear infinite;
}
@keyframes holo-shift {
  0% { background-position: 0% 0; }
  100% { background-position: 200% 0; }
}
header h1 {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
}
header h1 img {
  height: 28px;
  display: block;
}
header h1 span {
  font-size: 0.85rem;
  font-weight: 300;
  color: rgba(255, 255, 255, 0.7);
  letter-spacing: 2px;
  text-transform: uppercase;
}
main {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 400px;
  margin: 0 auto;
  padding: 1rem 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
.tile {
  display: block;
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  height: 150px;
  text-decoration: none;
  box-shadow: 0 2px 12px rgba(0,0,0,0.5);
  transition: transform 0.15s;
}
.tile:active {
  transform: scale(0.98);
}
.tile img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
#tile-snorlax img { object-position: center 32%; }
#tile-munchlax img { object-position: center 9%; }
</style>
</head>
<body>
<header>
  <h1><img src="images/pokemon-logo.svg" alt="Pokemon"><span>Snorlax &amp; Munchlax</span></h1>
</header>
<main>
  <a class="tile" href="snorlax-cards.html" id="tile-snorlax">
    <img src="images/snorlax-tile.jpg" alt="Snorlax">
  </a>
  <a class="tile" href="munchlax.html" id="tile-munchlax">
    <img src="images/munchlax-tile.jpg" alt="Munchlax">
  </a>
</main>
<script>
document.querySelectorAll('.tile').forEach(function(t) {
  t.addEventListener('click', function(e) { e.preventDefault(); window.location.href = this.href; });
});
</script>
</body>
</html>
