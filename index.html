<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokemon Collection Tracker</title>
<style>
:root {
  --bg: #0d0d0d;
  --accent: #ffcb05;
  --green: #3ecf8e;
  --blue: #3d7dca;
  --text: #e8e8e8;
  --text-dim: #777;
  --border: #2a2a3e;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.5;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
}
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url('images/pokeball-bg.jpg') center center / cover no-repeat;
  opacity: 0.12;
  z-index: 0;
  pointer-events: none;
}
header {
  position: relative;
  z-index: 1;
  background: rgba(13, 13, 13, 0.85);
  border-bottom: 2px solid var(--accent);
  padding: 1rem 1rem;
  text-align: center;
}
header h1 {
  font-size: 1.2rem;
  color: var(--accent);
  font-weight: 700;
}
header p {
  font-size: 0.8rem;
  color: var(--text-dim);
  margin-top: 0.15rem;
}
main {
  position: relative;
  z-index: 1;
  flex: 1;
  width: 100%;
  padding: 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
.tile {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  position: relative;
  border: 1px solid rgba(255,203,5,0.2);
  border-radius: 16px;
  padding: 1rem 1rem;
  text-decoration: none;
  color: var(--text);
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 2px 12px rgba(0,0,0,0.5);
  overflow: hidden;
  flex: 1;
  min-height: 160px;
}
.tile::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  z-index: 0;
  transition: transform 0.3s;
}
.tile::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.15) 100%);
  z-index: 1;
}
.tile > * {
  position: relative;
  z-index: 2;
}
#tile-komiya::before {
  background-image: url('images/komiya-tile.jpg');
}
#tile-kanda::before {
  background-image: url('images/kanda-tile.jpg');
}
#tile-gholdengo::before {
  background-image: url('images/gholdengo-tile.jpg');
  background-position: top center;
}
.tile:active {
  transform: scale(0.98);
}
.tile-name {
  font-size: 1.35rem;
  font-weight: 800;
  color: var(--accent);
  text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 3px rgba(0,0,0,1);
  display: block;
  margin-bottom: 0.15rem;
}
.tile-count {
  font-size: 0.8rem;
  color: #ccc;
  font-weight: 600;
  text-shadow: 0 1px 4px rgba(0,0,0,0.9);
  display: block;
  margin-bottom: 0.5rem;
}
.tile-progress-row {
  display: flex;
  align-items: center;
  gap: 0.6rem;
}
.tile-progress-text {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--green);
  white-space: nowrap;
  min-width: 85px;
  text-shadow: 0 1px 4px rgba(0,0,0,0.9);
}
.tile-progress-bar {
  flex: 1;
  height: 6px;
  background: rgba(255,255,255,0.15);
  border-radius: 3px;
  overflow: hidden;
}
.tile-progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--blue), var(--green));
  border-radius: 3px;
  transition: width 0.5s ease;
}
footer {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 1rem;
  color: var(--text-dim);
  font-size: 0.7rem;
  background: rgba(13,13,13,0.85);
}
footer a { color: var(--blue); text-decoration: none; }
</style>
</head>
<body>
<header>
  <h1>Pokemon Collection Tracker</h1>
  <p>Track your TCG card collections</p>
</header>
<main>
  <a class="tile" href="komiya.html" id="tile-komiya">
    <span class="tile-name">Tomokazu Komiya</span>
    <span class="tile-count">278 cards &middot; All eras</span>
    <div class="tile-progress-row">
      <span class="tile-progress-text" id="komiya-progress">0 / 278 (0%)</span>
      <div class="tile-progress-bar"><div class="tile-progress-fill" id="komiya-fill"></div></div>
    </div>
  </a>
  <a class="tile" href="kanda.html" id="tile-kanda">
    <span class="tile-name">Shinji Kanda</span>
    <span class="tile-count">33 cards &middot; SWSH &amp; SV</span>
    <div class="tile-progress-row">
      <span class="tile-progress-text" id="kanda-progress">0 / 33 (0%)</span>
      <div class="tile-progress-bar"><div class="tile-progress-fill" id="kanda-fill"></div></div>
    </div>
  </a>
  <a class="tile" href="gholdengo.html" id="tile-gholdengo">
    <span class="tile-name">Gholdengo</span>
    <span class="tile-count">16 cards &middot; Gholdengo &amp; Gimmighoul</span>
    <div class="tile-progress-row">
      <span class="tile-progress-text" id="gholdengo-progress">0 / 16 (0%)</span>
      <div class="tile-progress-bar"><div class="tile-progress-fill" id="gholdengo-fill"></div></div>
    </div>
  </a>
</main>
<footer>
  <p>Data from <a href="https://pokemon.com/" target="_blank" rel="noopener">pokemon.com</a> &amp; <a href="https://pokemontcg.io/" target="_blank" rel="noopener">pokemontcg.io</a></p>
</footer>
<script>
(function() {
  function countCollected(key) {
    try {
      var d = localStorage.getItem(key);
      if (!d) return 0;
      var obj = JSON.parse(d);
      var count = 0;
      for (var k in obj) {
        if (obj.hasOwnProperty(k) && obj[k] > 0) count++;
      }
      return count;
    } catch(e) { return 0; }
  }

  function updateTile(id, key, total) {
    var count = countCollected(key);
    var pct = total > 0 ? Math.round(count / total * 100) : 0;
    document.getElementById(id + "-progress").textContent =
      count + " / " + total + " (" + pct + "%)";
    document.getElementById(id + "-fill").style.width = pct + "%";
  }

  updateTile("komiya", "komiya-tcg", 278);
  updateTile("kanda", "kanda-tcg", 33);
  updateTile("gholdengo", "gholdengo-tcg", 16);
})();
</script>
</body>
</html>
