<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pokemon Collection Tracker</title>
<style>
:root {
  --bg: #0d0d0d;
  --accent: #ffcb05;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  height: 100dvh;
  overflow: hidden;
}
body {
  background: #000;
  color: #e8e8e8;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  display: flex;
  flex-direction: column;
  touch-action: none;
}
header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 100;
  background: rgba(13, 13, 13, 0.97);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: none;
  padding: 0.8rem 1rem;
  text-align: center;
}
header::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 4px;
  background: linear-gradient(90deg,
    #ff6ec7 0%, #a855f7 12%, #6366f1 22%, #3b82f6 32%,
    #22d3ee 42%, #34d399 52%, #facc15 62%, #fb923c 72%,
    #f43f5e 82%, #c084fc 92%, #ff6ec7 100%);
  background-size: 200% 100%;
  animation: holo-shift 3s linear infinite;
}
@keyframes holo-shift {
  0% { background-position: 0% 0; }
  100% { background-position: 200% 0; }
}
header h1 {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
}
header h1 img {
  height: 28px;
  display: block;
}
header h1 span {
  font-size: 0.85rem;
  font-weight: 300;
  color: rgba(255, 255, 255, 0.7);
  letter-spacing: 2px;
  text-transform: uppercase;
}
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding: 20px;
  min-height: 0;
}
.tile {
  flex: 1;
  display: block;
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  text-decoration: none;
  min-height: 0;
}
.tile:active {
  opacity: 0.85;
}
.tile img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
#tile-komiya img { object-position: center 61%; }
#tile-kanda img { object-position: center 35%; }
#tile-gholdengo img { object-position: center 78%; }
</style>
</head>
<body>
<header>
  <h1><img src="images/pokemon-logo.svg" alt="Pokemon"><span>Collection Tracker</span></h1>
</header>
<main>
  <a class="tile" href="komiya.html" id="tile-komiya">
    <img src="images/komiya-tile.jpg" alt="Tomokazu Komiya">
  </a>
  <a class="tile" href="kanda.html" id="tile-kanda">
    <img src="images/kanda-tile.jpg" alt="Shinji Kanda">
  </a>
  <a class="tile" href="gholdengo.html" id="tile-gholdengo">
    <img src="images/gholdengo-tile.jpg" alt="Gholdengo">
  </a>
</main>
<script>
document.querySelectorAll('.tile').forEach(function(t) {
  t.addEventListener('click', function(e) { e.preventDefault(); window.location.href = this.href; });
});
(function(){var h=document.querySelector('header'),m=document.querySelector('main');function fix(){m.style.paddingTop=(h.offsetHeight+20)+'px';}fix();window.addEventListener('resize',fix);})();
</script>
</body>
</html>
